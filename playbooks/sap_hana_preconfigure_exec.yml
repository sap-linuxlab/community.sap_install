---

# Ready to use playbook to preconfigure systems for SAP HANA installation.
# See README.md for usage instructions and variable definitions.

# NOTE: This playbook is not intended for user modification and should be used as-is.
# Any changes to control the executed Ansible Roles should be made trough the role variables.

- name: Prepare system for SAP HANA Installation
  hosts: "{{ sap_hana_group | d((groups['all'] == []) | ternary ('localhost', 'all')) }}"
  become: true
  tasks:
    - name: Summary of provided role variables
      ansible.builtin.debug:
        msg: |
          The SAP HANA preconfiguration will execute with the following configuration:
          Hostname                : {{ sap_general_preconfigure_hostname | d(ansible_facts['hostname']) }}
          IP Address              : {{ sap_general_preconfigure_ip | d(ansible_facts['default_ipv4'].address) }}
          Domain                  : {{ sap_general_preconfigure_domain | d(ansible_facts['domain'], true) }}
          Modify hosts            : {{ sap_general_preconfigure_modify_etc_hosts | d('false') }}
          Update OS packages      : {{ sap_hana_preconfigure_update | d('false') }}
          Reboot after update     : {{ sap_hana_preconfigure_reboot_ok | d('false') }}
          Fail if reboot is needed: {{ sap_hana_preconfigure_fail_if_reboot_required | d('true') }}

    # NOTE: If the variable 'sap_playbook_parameter_confirm' is set to true (default is false),
    # the playbook waits for confirmation before proceeding for 60 minutes.
    - name: Pause Playbook to verify parameters
      when: sap_playbook_parameter_confirm | d(false)
      ansible.builtin.pause:
        minutes: 60

    - name: Perform the general SAP configuration
      ansible.builtin.include_role:
        name: community.sap_install.sap_general_preconfigure

    - name: Perform the SAP HANA specific configuration
      ansible.builtin.include_role:
        name: community.sap_install.sap_hana_preconfigure
