---

# Ansible Playbook for installing a new scale-out SAP HANA system, using the role 'sap_hana_install'.
#
# The system is installed from master node 'host0', which is the first host of the play,
# and the other hosts are added to it as listed in 'sap_hana_install_addhosts'.
#
# Prerequisites:
# - The software directory contains the IMDB_SERVER*SAR file, IMDB_*SAR files of all components to be installed and the SAPCAR executable.
# - All hosts are prepared for SAP HANA, e.g. by the roles 'sap_general_preconfigure' and 'sap_hana_preconfigure'.
# - SSH communication works between all hosts.
#
# See the README of the role 'sap_hana_install' for all available variables.

- name: Ansible Play for SAP HANA installation - Scale-out
  hosts: host0, host1, host2, host3
  become: true
  any_errors_fatal: true
  tasks:

    - name: Execute Ansible Role sap_hana_install
      ansible.builtin.include_role:
        name: community.sap_install.sap_hana_install
      vars:
        sap_hana_install_sid: 'H01'
        sap_hana_install_instance_nr: '01'
        sap_hana_install_addhosts: 'host1:role=worker,host2:role=worker:group=g02,host3:role=standby:group=g02'
        sap_hana_install_software_directory: /software/hana
        sap_hana_install_master_password: 'NewPass$321'  # Do not use, this is example only!
        sap_hana_install_sapadm_password: 'NewPass$321'  # Do not use, this is example only!

        # Set to 'false', if hosts1 to host3 are being added to an existing host0 master node.
        sap_hana_install_new_system: true
