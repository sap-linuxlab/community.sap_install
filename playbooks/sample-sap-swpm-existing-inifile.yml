# Ansible Playbook for installing an SAP system with an existing sapinst inifile, using the role 'sap_swpm'.
#
# The role uses the file 'inifile.params' from the directory defined in 'sap_swpm_inifile_directory'.
# Product ID, software path, SID and FQDN are read from the inifile, so they are not defined here.
# Variables for generating the inifile are not used, because the inifile generation is skipped.
#
# Prerequisites:
# - The file 'inifile.params' is present on the host in the directory 'sap_swpm_inifile_directory'.
#   It can be a file from a previous SWPM run or a file generated by the role 'sap_swpm',
#   by running it with the tag 'sap_swpm_generate_inifile' and copying the result as 'inifile.params'.
# - The inifile does not contain uncommented 'des25' lines, see SAP Note 2609804.
# - The software path of the inifile contains all installation media required by the product,
#   including SAPCAR and SWPM, as described in the README of the role 'sap_swpm'.
#   The role 'sap_install_media_detect' can be used to prepare such directory.
#
# See the README of the role 'sap_swpm' for all available variables.

- name: Ansible Play for SAP SWPM installation using an existing inifile
  hosts: all
  become: true
  any_errors_fatal: true
  tasks:

    - name: Execute Ansible Role sap_swpm
      ansible.builtin.include_role:
        name: community.sap_install.sap_swpm
      vars:
        sap_swpm_inifile_directory: /software/sap_swpm/inifiles
