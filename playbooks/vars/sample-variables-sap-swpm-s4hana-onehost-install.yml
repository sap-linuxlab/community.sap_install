---

# This is a sample variable file for the 'sap_swpm' role.
# Scope: Installation of SAP S/4HANA 2025 one-host SAP system.
#
# See the README of the role 'sap_swpm' for details about the role and its variables.

# NOTE: Passwords defined in this file are for demonstration purposes only and should be changed for production use.


### Variables for the 'sap_swpm' role
# SAP Product ID for New Installation
sap_swpm_product_catalog_id: NW_ABAP_OneHost:S4HANA2025.CORE.HDB.ABAP

# List of inifile sections to be generated in the inifile.params
sap_swpm_inifile_sections_list:
  - swpm_installation_media
  - swpm_installation_media_swpm2_hana
  - credentials
  - credentials_hana
  - db_config_hana
  - db_connection_nw_hana
  - nw_config_other
  - nw_config_central_services_abap
  - nw_config_primary_application_server_instance
  - nw_config_ports
  - nw_config_host_agent
  - sap_os_linux_user

# The directory with installation media. The SAPCAR and SWPM paths fall back to it, if they are not defined.
sap_swpm_software_path: /software/sap_swpm_download_basket

# Optional: Override of a role variable and its default, including Booleans.
# Role Specific variables, such as 'sap_swpm_run_sapinst', are not read from this dictionary.
sap_swpm_role_parameters_dict:
  sap_swpm_install_saphostagent: false

# Optional: Update of a parameter in the generated inifile, after it was generated.
sap_swpm_inifile_parameters_dict:
  HDB_System_Check_Dialogs.initTopology: false

# SAP NetWeaver Passwords
sap_swpm_master_password: "NewPass$321"
sap_swpm_ddic_000_password: "NewPass$321"

# SAP HANA Passwords
sap_swpm_db_system_password: "NewPass$321"
sap_swpm_db_systemdb_password: "NewPass$321"
sap_swpm_db_schema_abap: "SAPHANADB"
sap_swpm_db_schema_abap_password: "NewPass$321"
sap_swpm_db_sidadm_password: "NewPass$321"

# SAP NetWeaver Instance Parameters
sap_swpm_sid: S4H
sap_swpm_ascs_instance_nr: "00"
sap_swpm_ascs_instance_hostname: "{{ ansible_facts['hostname'] }}"
sap_swpm_pas_instance_nr: "01"
sap_swpm_pas_instance_hostname: "{{ ansible_facts['hostname'] }}"
sap_swpm_fqdn: "poc.cloud"

# SAP HANA Instance Parameters
sap_swpm_db_host: "{{ ansible_facts['hostname'] }}"
sap_swpm_db_sid: HDB
sap_swpm_db_instance_nr: "00"
