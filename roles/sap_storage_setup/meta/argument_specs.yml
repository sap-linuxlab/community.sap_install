---

# Argument Spec is using lazy validation and allows for invalid types or values to proceed.
# Explicit validation using assert modules is executed afterwards to ensure that the variables meet the required criteria.
#
# NOTE: The key 'required' has to be used very carefully, because every scenario is a different combination of keys.
# Only a key that is shared by all scenarios can be marked as required, like 'name'.
# Keys that are mandatory for one scenario only are validated by the role instead.
# The default of 'required' is false, so it is declared only where it is true.

argument_specs:

  main:
    short_description: SAP system storage setup
    options:

      sap_storage_setup_definition:
        description:
          - Describes the filesystems to be configured.

        example:
          sap_storage_setup_definition:
            - name: hanadata
              mountpoint: /hana/data
              disk_size: 100G
              filesystem_type: xfs

            - name: hanalog
              mountpoint: /hana/log
              disk_size: 100G
              filesystem_type: xfs

        elements: dict
        required: true
        type: list
        options:

          disk_size:
            description:
              - Size of the disk device that is used for the filesystem.
              - For filesystems with no LVM logical volume striping, this is the total size of the filesystem.
              - For filesystems with LVM LV striping defined (`lvm_lv_stripes`), this is the size of each disk.
              - The resulting filesystem size will be `disk_size` multiplied by `lvm_lv_stripes` (=disks).
              - An integer is handled as size in GB, a string can carry the unit suffix `G` or `T`.
              - The type is `raw`, because a declared type would convert the value,
              - and the role accepts both an integer and a string. The value is validated by the role instead.
            type: raw

          filesystem_type:
            default: xfs
            description:
              - The type of filesystem that will be created on the logical volume.
              - The role variable `sap_storage_setup_local_filesystem_type` is used when this key is not defined.
            type: str

          lvm_lv_name:
            description:
              - The name of the LVM volume.
              - The default name is derived from the name value of the filesystem definition entry, for example 'lv_hanalog'.
            type: str

          lvm_lv_stripes:
            default: 1
            description:
              - Number of disks that will be configured in a striped volume.
              - This requires the availability of the same amount of unused disks, which must be of the size defined in `disk_size`.
            type: int

          lvm_lv_stripe_size:
            description:
              - When setting up a striped volume, the stripe size can be defined.
              - Example format - "128K".
            type: str

          lvm_pv_options:
            description:
              - Free-form options that are passed to the `pvcreate` command of the volume group.
            type: str

          lvm_vg_name:
            description:
              - The name of the LVM volume group.
              - The default name is derived from the name value of the filesystem definition entry, for example 'vg_hanalog'.
            type: str

          lvm_vg_options:
            description:
              - Free-form options that are passed to the `vgcreate` command of the volume group.
            type: str

          lvm_vg_physical_extent_size:
            default: 4
            description:
              - Adjustable size of the physical extents of the volume group in LVM.
              - can be optionally suffixed by a UNIT (k/K/m/M/g/G), default unit is megabyte.
            type: str

          mountpoint:
            description:
              - The path to where the filesystem will be mounted.
              - This can be left out for the definition of a swap volume.
            type: str

          name:
            description:
              - A name of the filesystem definition entry.
              - This name is used to generate volume group name and logical volume name.
            required: true
            type: str

          nfs_filesystem_type:
            default: nfs4
            description:
              - The type of the NFS filesystem, for example `nfs`, `nfs4`.
            type: str

          nfs_mount_options:
            description:
              - Mount options to use for the NFS mount.
              - The role variable `sap_storage_setup_nfs_mount_options` is used when this key is not defined.
            type: str

          nfs_path:
            description:
              - When defining an NFS filesystem, this is the directory path of the filesystem to be mounted.
            type: str

          nfs_server:
            description:
              - When defining an NFS filesystem, this is the address of the NFS server.
              - The address must contain the root path, in which the mount directories exist or will be created.
              - For example, `192.168.1.100:/`.
            type: str

          swap_path:
            description:
              - The path to the swap file.
              - When this option is defined for a swap filesystem definition, it will create a swap file on an existing filesystem.
            type: str


      sap_storage_setup_host_type:
        description:
          - The type of service the target system is going to be configured for.
          - This can be a list of multiple types which apply to a single host.
          - Required only for NFS mounts, where it selects the `/usr/sap` subdirectories to create.
          - "Supported values are:"
          - "SAP HANA: `hana_primary`, `hana_secondary`"
          - "SAP ABAP: `nwas_abap_ascs`, `nwas_ers`, `nwas_abap_pas`, `nwas_abap_aas`"
          - "SAP JAVA: `nwas_java_scs`, `nwas_ers`, `nwas_java_ci`"
          - "Others: `nwas_webdisp`"
        # type can be list or string, the code will convert it to a list
        # 'choices' is not declared, because it does not cover a list of values and would reject
        # a valid multi type host list before the role validation runs.


      sap_storage_setup_local_filesystem_type:
        default: xfs
        description:
          - The filesystem type used for block storage volumes.
          - Applies to every definition entry that does not carry its own `filesystem_type` key.
        type: str

      sap_storage_setup_multipath_enable_and_detect:
        default: false
        description:
          - Define if multipathing should be enabled and dynamic multipath devices detected and used for the filesystem setup.
        type: bool

      sap_storage_setup_nfs_filesystem_type:
        default: nfs4
        description:
          - The NFS protocol used for NFS mounts, for example `nfs` or `nfs4`.
          - Applies to every NFS entry that does not carry its own `nfs_filesystem_type` key.
        type: str

      sap_storage_setup_nfs_mount_options:
        default: defaults
        description:
          - The mount options used for NFS mounts.
          - Applies to every NFS entry that does not carry its own `nfs_mount_options` key.
        type: str

      # No default is declared on purpose. The role tests this variable for being defined, and an
      # empty default would be applied to every entry that omits the 'nfs_server' key.
      sap_storage_setup_nfs_server:
        description:
          - The address of the NFS server, including the root path in which the mount directories
            exist or will be created, for example `192.168.1.100:/`.
          - Applies to every NFS entry that does not carry its own `nfs_server` key.
          - Leave this variable undefined to require the key on each entry instead.
        type: str

      # A string of two digits is the only accepted form of an instance number, so the type is
      # declared. An unquoted value is still rejected by the role validation, which compares the
      # value against the two digit pattern.
      sap_storage_setup_nwas_abap_aas_instance_nr:
        description:
          - Instance number of the NetWeaver ABAP additional application server.
          - Used for the host type `nwas_abap_aas` to build the `/usr/sap` subdirectory `D<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_abap_ascs_instance_nr:
        description:
          - Instance number of the ABAP central services instance.
          - Used for the host type `nwas_abap_ascs` to build the `/usr/sap` subdirectory `ASCS<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_abap_ers_instance_nr:
        description:
          - Instance number of the enqueue replication server, kept for backwards compatibility.
          - Used for the host type `nwas_abap_ers` to build the `/usr/sap` subdirectory `ERS<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_abap_pas_instance_nr:
        description:
          - Instance number of the NetWeaver ABAP primary application server.
          - Used for the host type `nwas_abap_pas` to build the `/usr/sap` subdirectory `D<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_ers_instance_nr:
        description:
          - Instance number of the enqueue replication server, shared by ABAP and JAVA.
          - Used for the host type `nwas_ers` to build the `/usr/sap` subdirectory `ERS<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_java_ci_instance_nr:
        description:
          - Instance number of the NetWeaver JAVA central instance.
          - Used for the host type `nwas_java_ci` to build the `/usr/sap` subdirectory `J<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_java_ers_instance_nr:
        description:
          - Instance number of the enqueue replication server, kept for backwards compatibility.
          - Used for the host type `nwas_java_ers` to build the `/usr/sap` subdirectory `ERS<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_java_scs_instance_nr:
        description:
          - Instance number of the JAVA central services instance.
          - Used for the host type `nwas_java_scs` to build the `/usr/sap` subdirectory `SCS<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_nwas_webdisp_instance_nr:
        description:
          - Instance number of the SAP Web Dispatcher.
          - Used for the host type `nwas_webdisp` to build the `/usr/sap` subdirectory `W<nr>`.
          - Must be a quoted string of two digits, for example `'01'`.
        type: str

      sap_storage_setup_sid:
        description:
          - SID of the SAP service.
          - Required only for NFS mounts, where it is used to build the `/usr/sap` subdirectory names.
        type: str
