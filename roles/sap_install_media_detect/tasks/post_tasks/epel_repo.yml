---

# The EPEL repository is enabled by 'pre_tasks/enable_archive_handling.yml' task file on Red Hat hosts.

# Removing the release package does not remove the GPG key of the repository,
# so the key is removed separately, and it has to be found first.
#
# NOTE: Command is unchanged, but it could be replaced with a more robust method if needed.
#       This would require to updating output handling as it has different syntax.
# set -o pipefail
# && rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE} %{SUMMARY}\n'
# | grep -iE 'epel[^0-9]*{{ ansible_facts['distribution_major_version'] }}[^0-9]'
# | cut -d' ' -f1
- name: SAP Install Media Detect - Cleanup - EPEL - Find the EPEL GPG keys of this operating system release
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail
      && rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE}\t%{SUMMARY}\n'
      | awk '/gpg/&&/Fedora/{gsub ("\\(epel", "EPEL "); gsub (" \\(", " "); if ($0 ~ /EPEL {{
        ansible_facts['distribution_major_version'] }}/)print}'
  register: __sap_install_media_detect_register_epel_gpg_keys
  failed_when: false
  changed_when: false


- name: Block for the removal of the EPEL GPG keys
  when: __sap_install_media_detect_register_epel_gpg_keys.stdout_lines | length > 0
  block:

    - name: SAP Install Media Detect - Cleanup - EPEL - Remove the EPEL GPG key with the rpm_key module
      ansible.builtin.rpm_key:
        state: absent
        key: "{{ sap_install_media_detect_epel_gpg_key_url }}"
      register: __sap_install_media_detect_register_epel_gpg_key_removal
      until: __sap_install_media_detect_register_epel_gpg_key_removal is success
      retries: 10
      delay: 5
      when: sap_install_media_detect_use_rpm_key_module_for_removing_the_key

    # Reason for noqa: This is the alternative to the module above,
    # controlled by the user variable 'sap_install_media_detect_use_rpm_key_module_for_removing_the_key'.
    - name: SAP Install Media Detect - Cleanup - EPEL - Remove the EPEL GPG key with the rpm command  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: "rpm -e {{ key_item | quote }}"
      register: __sap_install_media_detect_register_epel_gpg_key_rpm_e
      changed_when: __sap_install_media_detect_register_epel_gpg_key_rpm_e.rc == 0
      loop: "{{ __sap_install_media_detect_register_epel_gpg_keys.stdout_lines
              | map('split') | map('first') | list }}"
      loop_control:
        loop_var: key_item
      when: not sap_install_media_detect_use_rpm_key_module_for_removing_the_key


    # Both ways of removing the key can report success and still leave a key behind,
    # so the result is verified with the same query that found the keys in the first place.
    - name: SAP Install Media Detect - Cleanup - EPEL - Find the EPEL GPG keys after their removal
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail
          && rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE}\t%{SUMMARY}\n'
          | awk '/gpg/&&/Fedora/{gsub ("\\(epel", "EPEL "); gsub (" \\(", " "); if ($0 ~ /EPEL {{
            ansible_facts['distribution_major_version'] }}/)print}'
      register: __sap_install_media_detect_register_epel_gpg_keys_remaining
      failed_when: false
      changed_when: false

    - name: SAP Install Media Detect - Cleanup - EPEL - Fail if an EPEL GPG key is still present
      ansible.builtin.fail:
        msg: |
          FAIL: The role enabled the EPEL repository and removed it again,
          but the following GPG keys of that repository are still present on this host:
          {% for __key in __epel_gpg_keys_remaining %}
          - {{ __key }}
          {% endfor %}
          Remove them with the 'rpm -e' command.
      when: __epel_gpg_keys_remaining | length > 0
      vars:
        __epel_gpg_keys_remaining:
          "{{ __sap_install_media_detect_register_epel_gpg_keys_remaining.stdout_lines | d([])
              | map('split') | map('first') | list }}"

- name: SAP Install Media Detect - Cleanup - EPEL - Remove the EPEL release package
  ansible.builtin.package:
    name: "{{ __sap_install_media_detect_epel_release_package_name }}"
    state: absent
