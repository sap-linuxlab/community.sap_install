---

# Task file to set global facts for later consumption by the roles in this collection.
# NOTE: Any changes in related ansible roles must be reflected here accordingly.

# NOTE: noqa var-naming[no-role-prefix] is required when setting variable names for other roles.
# This task file will set facts for later consumption by the roles in this collection:
# - 'sap_swpm'
# - 'sap_hana_install'
# - 'sap_anydb_install_oracle'


### Facts for the 'sap_swpm' role
# Primary software path variable for 'sap_swpm' role.
# NOTE: The following variables were deprecated in 'sap_swpm' role: sap_swpm_swpm_path, sap_swpm_install_directory.
- name: SAP Install Media Detect - Global Variables - Set the variable of the SWPM installation media directory
  ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
    sap_swpm_software_path: "{{ __sap_install_media_detect_fact_swpm_directory }}"

# SAPCAR path is optional variable for 'sap_swpm', but it is set because it is mandatory for this role.
- name: SAP Install Media Detect - Global Variables - Set the variables of the SAPCAR program
  ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
    sap_swpm_sapcar_path: "{{ __sap_install_media_detect_fact_sapcar_path | d('') | dirname }}/"
    sap_swpm_sapcar_file_name: "{{ __sap_install_media_detect_fact_sapcar_path | d('') | basename }}"
  when: __sap_install_media_detect_fact_sapcar_path | d('') | length > 0

# SWPM file can be controlled by setting 'sap_install_media_detect_swpm'.
# - 'true' to enable SWPM file preparation and passing the 'sap_swpm_path' fact.
# - 'false' to skip SWPM file preparation and let 'sap_swpm' role handle it on its own.
- name: SAP Install Media Detect - Global Variables - Set the variable of the SWPM archive directory
  ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
    sap_swpm_path:
      "{{ __sap_install_media_detect_fact_main_directory
          ~ ('/sap_swpm' if sap_install_media_detect_move_or_copy_archives else '') }}"
    # 'sap_swpm_file_name' is not set, because the 'sap_swpm' role detects the file name itself.
  when: sap_install_media_detect_swpm


### Facts for the 'sap_hana_install' role

- name: SAP Install Media Detect - Global Variables - Set the variables of the SAP HANA installation media
  ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
    sap_hana_install_software_directory:
      "{{ __sap_install_media_detect_fact_main_directory
          ~ ('/sap_hana' if sap_install_media_detect_move_or_copy_archives else '') }}/"
  when: sap_install_media_detect_db | d('') == 'saphana'

# Extraction path fact is provided only if the 'sap_install_media_detect_extract_archives' variable is set to 'true'.
- name: SAP Install Media Detect - Global Variables - Set the variable of the SAP HANA extraction directory
  ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
    sap_hana_install_software_extract_directory:
      "{{ __sap_install_media_detect_fact_main_directory }}/sap_hana_extracted/"
  when:
    - sap_install_media_detect_db | d('') == 'saphana'
    - sap_install_media_detect_extract_archives


### Guard for the two blocks below, which both write 'sap_swpm_cd_export_path'.
# The role parameter 'sap_install_media_detect_export' accepts only one valid value.
# If for some reason detection finds more than one exports,
# we need to ensure that role does not proceed overwriting 'sap_swpm_cd_export_path'.
- name: SAP Install Media Detect - Global Variables - Fail if more than one installation export was located
  ansible.builtin.fail:
    msg: |
      FAIL: More than one SAP installation export was located, but only one can be handed over
      to the 'sap_swpm' role in the variable 'sap_swpm_cd_export_path'.
      Located installation exports: {{ __export_keys | join(', ') }}
      Requested installation export: {{ sap_install_media_detect_export | d('none', true) }}
  vars:
    __export_keys:
      "{{ ((__sap_install_media_detect_fact_located_files | d({}) | list)
           + (__sap_install_media_detect_fact_located_extracted | d({}) | list))
          | select('match', 'export_') | list }}"
  when: __export_keys | length > 1


### Single files that are located by 'organize/locate_basket.yml'.
# NOTE: File types not listed here are handled by 'sap_swpm' role automatically.
- name: Block for the files of the SWPM installation media
  vars:
    __located_basket: "{{ __sap_install_media_detect_fact_located_files | d({}) }}"
  block:

    - name: SAP Install Media Detect - Global Variables - Set the variables of the SAP Maintenance Planner stack XML
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_mp_stack_path: "{{ __located_basket['mpstack'] | dirname }}/"
        sap_swpm_mp_stack_file_name: "{{ __located_basket['mpstack'] | basename }}"
      when: "'mpstack' in __located_basket"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP S/4HANA installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __located_basket['export_s4hana'] }}/"
      when: "'export_s4hana' in __located_basket"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP BW/4HANA installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __located_basket['export_bw4hana'] }}/"
      when: "'export_bw4hana' in __located_basket"


### Extracted directories of the installation media that are located by 'organize/locate_extracted.yml'.
- name: Block for the directories of the extracted installation media
  vars:
    __extracted: "{{ __sap_install_media_detect_fact_located_extracted | d({}) }}"
  block:

    # SAP HANA client is passed to the 'sap_swpm' role, but database itself is handled by 'sap_hana_install' role facts.
    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP HANA client
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_rdbms_path: "{{ __extracted['db_client_saphana'] | first }}/"
      when: "'db_client_saphana' in __extracted"


    # SAP ASE
    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP ASE database
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_sapase_path: "{{ __extracted['db_sapase'] | first }}/"
      when: "'db_sapase' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP ASE client
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_sapase_client_path: "{{ __extracted['db_client_sapase'] | first }}/"
      when: "'db_client_sapase' in __extracted"


    # SAP MaxDB
    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP MaxDB database
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_sapmaxdb_path: "{{ __extracted['db_sapmaxdb'] | first }}/"
      when: "'db_sapmaxdb' in __extracted"

    # IBM Db2
    - name: SAP Install Media Detect - Global Variables - Set the variable of the IBM Db2 database
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_ibmdb2_path: "{{ __extracted['db_ibmdb2'] | first }}/"
      when: "'db_ibmdb2' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the IBM Db2 client
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_ibmdb2_client_path: "{{ __extracted['db_client_ibmdb2'] | first }}/"
      when: "'db_client_ibmdb2' in __extracted"


    # Oracle
    # The located directory is the one which holds the installer, and both consuming roles want the
    # directory above it, see the pattern of the component in the extracted directory matrix.
    - name: SAP Install Media Detect - Global Variables - Set the variables of the Oracle database
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_anydb_install_oracle_extract_path: "{{ __extracted['db_oracledb'] | first | dirname }}/"
        sap_swpm_cd_oracle_path: "{{ __extracted['db_oracledb'] | first | dirname }}/"
      when: "'db_oracledb' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the Oracle client
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_oracle_client_path: "{{ __extracted['db_client_oracledb'] | first | dirname }}/"
      when: "'db_client_oracledb' in __extracted"


    # Installation Exports
    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP ECC installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __extracted['export_sapecc'] | first }}/"
      when: "'export_sapecc' in __extracted"

    # The only export which is handed over in two parts and located by a pattern that matches below the part directory,
    # so the parts are the parents of what was found and the export directory is one above those.
    # NOTE: The two parts are taken by index, as the original did, so other parts are ignored.
    #       A second part which was not located leaves the variable empty.
    - name: SAP Install Media Detect - Global Variables - Set the variables of the SAP ECC IDES installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __parts[0] | dirname }}/"
        sap_swpm_cd_export_pt1_path: "{{ __parts[0] }}/"
        sap_swpm_cd_export_pt2_path: "{{ (__parts[1] ~ '/') if __parts | length > 1 else '' }}"
      vars:
        __parts: "{{ __extracted['export_sapecc_ides'] | map('dirname') | unique | list }}"
      when: "'export_sapecc_ides' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP NetWeaver AS ABAP installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __extracted['export_sapnwas_abap'] | first }}/"
      when: "'export_sapnwas_abap' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP NetWeaver AS Java installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __extracted['export_sapnwas_java'] | first }}/"
      when: "'export_sapnwas_java' in __extracted"

    # The located directories are the 'DATA_UNITS' of each part and are handed over as the parts themselves,
    # so the export directory is two levels above them.
    # NOTE: The two parts are taken by index for the same reason as the SAP ECC IDES export above.
    - name: SAP Install Media Detect - Global Variables - Set the variables of the SAP Solution Manager ABAP installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __parts[0] | dirname | dirname }}/"
        sap_swpm_cd_export_pt1_path: "{{ __parts[0] }}/"
        sap_swpm_cd_export_pt2_path: "{{ (__parts[1] ~ '/') if __parts | length > 1 else '' }}"
      vars:
        __parts: "{{ __extracted['export_sapsolman_abap'] }}"
      when: "'export_sapsolman_abap' in __extracted"

    - name: SAP Install Media Detect - Global Variables - Set the variable of the SAP Solution Manager Java installation export
      ansible.builtin.set_fact:  # noqa var-naming[no-role-prefix]
        sap_swpm_cd_export_path: "{{ __extracted['export_sapsolman_java'] | first }}/"
      when: "'export_sapsolman_java' in __extracted"


# Only the variables which were actually set are shown.
- name: SAP Install Media Detect - Global Variables - Show the variables set for the consuming roles
  ansible.builtin.debug:
    msg: |
      INFO: The following variables were set for the roles which consume the installation media.
      {% for variable_item in __variable_names %}
      {% if lookup('ansible.builtin.vars', variable_item, default='') | length > 0 %}
      {{ "%-45s" | format(variable_item) }}{{ lookup('ansible.builtin.vars', variable_item) }}
      {% endif %}
      {% endfor %}
  vars:
    __variable_names:
      - sap_hana_install_software_directory
      - sap_hana_install_software_extract_directory
      - sap_anydb_install_oracle_extract_path

      - sap_swpm_software_path
      - sap_swpm_path
      - sap_swpm_sapcar_path
      - sap_swpm_sapcar_file_name

      - sap_swpm_cd_rdbms_path
      - sap_swpm_cd_sapase_path
      - sap_swpm_cd_sapase_client_path
      - sap_swpm_cd_sapmaxdb_path
      - sap_swpm_cd_ibmdb2_path
      - sap_swpm_cd_ibmdb2_client_path
      - sap_swpm_cd_oracle_path
      - sap_swpm_cd_oracle_client_path

      - sap_swpm_cd_export_path
      - sap_swpm_cd_export_pt1_path
      - sap_swpm_cd_export_pt2_path

      - sap_swpm_mp_stack_path
      - sap_swpm_mp_stack_file_name
