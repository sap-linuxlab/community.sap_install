---

# The sapfile utility names one target directory per file and states whether the file is copied
# into it or moved into it:
# - A file that is copied stays in the main directory as well, because more than one of the roles
#   consuming the installation media expects it. Its target directory is 'auto', which means that
#   the role decides, see the fact of the automatic directories in 'main.yml'.
# - A file that is moved has exactly one consumer, so it is not left behind in the main directory.


# One copy per file and per automatic directory, so a file is placed in all of them.
# Both lists are empty unless there is something to copy, which skips the task without an extra
# condition, see 'main.yml'.
- name: SAP Install Media Detect - Organize - Copy the installation media into the component directories
  ansible.builtin.copy:
    src: "{{ file_item[0]['path'] }}"
    dest: "{{ __sap_install_media_detect_fact_main_directory }}/{{ file_item[1] }}/{{ file_item[0]['file'] }}"
    remote_src: true
    owner: "{{ __owner }}"
    group: "{{ __group }}"
    mode: "{{ __mode }}"
  loop: "{{ __sap_install_media_detect_fact_files_to_copy
            | product(__sap_install_media_detect_fact_auto_directories) | list }}"
  loop_control:
    loop_var: file_item
    label: "{{ file_item[1] }}/{{ file_item[0]['file'] }}"
  vars:
    # The same distinction as in 'main.yml', because the copy creates a new file and the mode of
    # the source is not carried over by the module.
    __owner:
      "{{ sap_install_media_detect_sapcar_owner if file_item[0]['sap_file_type'] == 'sapcar'
          else sap_install_media_detect_files_owner }}"
    __group:
      "{{ sap_install_media_detect_sapcar_group if file_item[0]['sap_file_type'] == 'sapcar'
          else sap_install_media_detect_files_group }}"
    __mode:
      "{{ sap_install_media_detect_sapcar_mode if file_item[0]['sap_file_type'] == 'sapcar'
          else sap_install_media_detect_files_mode }}"


- name: SAP Install Media Detect - Organize - Move the installation media into the component directories
  ansible.builtin.command:
    cmd: mv -- {{ file_item['path'] | quote }} {{ __destination | quote }}
  register: __sap_install_media_detect_register_move_to_component
  changed_when: __sap_install_media_detect_register_move_to_component.rc == 0
  loop: "{{ __sap_install_media_detect_fact_wanted_files | rejectattr('copy') | list }}"
  loop_control:
    loop_var: file_item
    label: "{{ file_item['target_dir'] }}/{{ file_item['file'] }}"
  vars:
    __destination:
      "{{ __sap_install_media_detect_fact_main_directory }}/{{ file_item['target_dir'] }}/{{ file_item['file'] }}"
