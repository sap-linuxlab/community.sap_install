---

# Validation
- name: SAP Host Agent - SSL - Assert that the variable 'sap_hostagent_config_ssl' is Boolean
  ansible.builtin.assert:
    that:
      - sap_hostagent_config_ssl is boolean
    fail_msg: |
      FAIL: The variable 'sap_hostagent_config_ssl' is undefined or not a Boolean.
  when: sap_hostagent_config_ssl is defined

- name: SAP Host Agent - SSL - Assert that the variable 'sap_hostagent_ssl_passwd' is defined as String and not empty
  ansible.builtin.assert:
    that:
      - sap_hostagent_ssl_passwd is defined
      - sap_hostagent_ssl_passwd is string
      - sap_hostagent_ssl_passwd | trim | length > 0
    fail_msg: |
      FAIL: The variable 'sap_hostagent_ssl_passwd' is undefined, not a String or empty.

- name: SAP Host Agent - SSL - Assert that the variable 'sap_hostagent_ssl_org' is defined as String and not empty
  ansible.builtin.assert:
    that:
      - sap_hostagent_ssl_org is defined
      - sap_hostagent_ssl_org is string
      - sap_hostagent_ssl_org | trim | length > 0
    fail_msg: |
      FAIL: The variable 'sap_hostagent_ssl_org' is undefined, not a String or empty.

- name: SAP Host Agent - SSL - Assert that the variable 'sap_hostagent_ssl_country' is defined as String and not empty
  ansible.builtin.assert:
    that:
      - sap_hostagent_ssl_country is defined
      - sap_hostagent_ssl_country is string
      - sap_hostagent_ssl_country | trim | length > 0
    fail_msg: |
      FAIL: The variable 'sap_hostagent_ssl_country' is undefined, not a String or empty.


# Using non-root user requires additional package 'acl' to be present.
# This is required when non-root user with sudo needs to become other non-root user.
- name: SAP Host Agent - SSL - Ensure ACL is installed for non-root user to enable become to 'sapadm' user
  ansible.builtin.package:
    name: acl
    state: present
  become: true
  # User 'root' is hardcoded as UUID 0 and it does not require 'acl' package.
  when: ansible_facts['user_uid'] != 0


# Execution
- name: SAP Host Agent - SSL - Get list of available OS users
  ansible.builtin.getent:
    database: passwd

- name: SAP Host Agent - SSL - Assert that the user 'sapadm' exists in the system
  ansible.builtin.assert:
    that:
      - "'sapadm' in ansible_facts['getent_passwd']"
    fail_msg: |
      FAIL: The required user 'sapadm' does not exist in the system.
      This indicates that installation completed successfully, but the user 'sapadm' was not created.
      Please investigate the installation logs for potential issues during user creation.


- name: Block to execute with elevated privileges
  become: true
  become_user: root
  block:

    - name: SAP Host Agent - SSL - Ensure 'sapadm' user home directory exists
      ansible.builtin.file:
        path: "/home/sapadm"
        state: directory
        mode: '0755'
        owner: sapadm
        group: sapsys

    # Ensure SSL is configured for agent communication
    # https://help.sap.com/viewer/6e1636d91ccc458c987094ee1fb864ae/HAG_CURRENT_VERSION/en-US/6aac42c2e742413da050eaecd57f785d.html
    - name: SAP Host Agent - SSL - Prepare directory for the Personal Security Environment (PSE)
      ansible.builtin.file:
        path: "/usr/sap/hostctrl/exe/sec"
        state: directory
        mode: '0755'
        owner: sapadm
        group: sapsys

    - name: SAP Host Agent - SSL - Stat /usr/sap/hostctrl/exe/sec/SAPSSLS.pse file
      ansible.builtin.stat:
        path: /usr/sap/hostctrl/exe/sec/SAPSSLS.pse
      register: __sap_hostagent_register_sapssls_pse_stat

    - name: SAP Host Agent - SSL - Fail if the /usr/sap/hostctrl/exe/sec/SAPSSLS.pse file exists
      ansible.builtin.fail:
        msg: |
          FAIL: The file /usr/sap/hostctrl/exe/sec/SAPSSLS.pse already exists.
          This indicates that SSL configuration may have already been performed or there is a leftover PSE file from a previous installation.
          To overwrite existing file, set 'sap_hostagent_overwrite' to 'true'.
      when:
        - __sap_hostagent_register_sapssls_pse_stat.stat.exists
        - not sap_hostagent_overwrite | d(false)


    - name: SAP Host Agent - SSL - Ensure any previous PSE generated by this role does not exist
      ansible.builtin.file:
        path: /usr/sap/hostctrl/exe/sec/SAPSSLS.pse
        state: absent
      when: sap_hostagent_overwrite | d(false)


- name: SAP Host Agent - SSL - Generate PSE certificate and the Certificate Signing Request (CSR)
  ansible.builtin.command:
    cmd: >-
      /usr/sap/hostctrl/exe/sapgenpse gen_pse
      -p SAPSSLS.pse
      -x "{{ sap_hostagent_ssl_passwd }}"
      -r /tmp/myhost-csr.p10
      "CN={{ ansible_facts['fqdn'] }}, O={{ sap_hostagent_ssl_org }}, C={{ sap_hostagent_ssl_country }}"
  become: true
  become_user: sapadm
  args:
    chdir: /usr/sap/hostctrl/exe/
  environment:
    LD_LIBRARY_PATH: /usr/sap/hostctrl/exe
    SECUDIR: /usr/sap/hostctrl/exe/sec
  register: __sap_hostagent_register_sapgenpse_gen_pse
  changed_when: "'Certificate Request:' in __sap_hostagent_register_sapgenpse_gen_pse.stdout"
  failed_when: "'ERROR' in __sap_hostagent_register_sapgenpse_gen_pse.stderr"


- name: SAP Host Agent - SSL - Grant SAP Host Agent access to the server PSE
  ansible.builtin.command:
    cmd: >-
      /usr/sap/hostctrl/exe/sapgenpse seclogin
      -p SAPSSLS.pse
      -x "{{ sap_hostagent_ssl_passwd }}"
      -O sapadm
  become: true
  become_user: sapadm
  args:
    chdir: /usr/sap/hostctrl/exe/
  environment:
    LD_LIBRARY_PATH: /usr/sap/hostctrl/exe
    SECUDIR: /usr/sap/hostctrl/exe/sec
  register: __sap_hostagent_register_sapgenpse_seclogin
  changed_when: "'Added SSO-credentials for PSE' in __sap_hostagent_register_sapgenpse_seclogin.stdout"
  failed_when: "'ERROR' in __sap_hostagent_register_sapgenpse_seclogin.stderr"


# # Right now there is no option to import the signed certificate. The CSR must be signed
# # by a valid CA in order to import it
# - name: SAP Host Agent - SSL - Import the signed certificate into the server PSE
#   ansible.builtin.command:
#     cmd: >-
#       /usr/sap/hostctrl/exe/sapgenpse import_own_cert
#       -p SAPSSLS.pse
#       -x "{{ sap_hostagent_ssl_passwd }}"
#       -c /tmp/myhost.p7b
#   become_user: sapadm
#   args:
#     chdir: /usr/sap/hostctrl/exe/
#   environment:
#     LD_LIBRARY_PATH: /usr/sap/hostctrl/exe
#     SECUDIR: /usr/sap/hostctrl/exe/sec


- name: SAP Host Agent - SSL - Verify the server certificate chain
  ansible.builtin.command:
    cmd: >-
      /usr/sap/hostctrl/exe/sapgenpse get_my_name
      -x "{{ sap_hostagent_ssl_passwd }}"
      -v
  become: true
  become_user: sapadm
  args:
    chdir: /usr/sap/hostctrl/exe/
  environment:
    LD_LIBRARY_PATH: /usr/sap/hostctrl/exe
    SECUDIR: /usr/sap/hostctrl/exe/sec
  register: __sap_hostagent_register_sapgenpse_get_my_name
  changed_when: "'Opening PSE' in __sap_hostagent_register_sapgenpse_get_my_name.stdout"


- name: SAP Host Agent - SSL - Restart SAP Host Agent to apply SSL configuration
  ansible.builtin.command:
    cmd: /usr/sap/hostctrl/exe/saphostexec -restart
  become: true
  register: __sap_hostagent_register_saphostexec_restart
  changed_when: "'start hostcontrol using profile' in __sap_hostagent_register_saphostexec_restart.stdout"
