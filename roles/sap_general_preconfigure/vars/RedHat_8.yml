---

__sap_general_preconfigure_sapnotes_versions:
  - { number: '2369910', version: '22' }
  - { number: '2772999', version: '29' }
  - { number: '1771258', version: '8' }

__sap_general_preconfigure_max_repo_type_x86_64: 'e4s'
__sap_general_preconfigure_max_repo_type_ppc64le: 'e4s'
__sap_general_preconfigure_max_repo_type_s390x: 'eus'

__sap_general_preconfigure_max_repo_type: "{{ lookup('vars', '__sap_general_preconfigure_max_repo_type_' + ansible_facts['architecture']) }}"

# RHEL 8 minor releases maximum repo support duration
__sap_general_preconfigure_max_repo_type_string_8_0: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_1: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_2: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_3: ''
__sap_general_preconfigure_max_repo_type_string_8_4: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_5: ''
__sap_general_preconfigure_max_repo_type_string_8_6: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_7: ''
__sap_general_preconfigure_max_repo_type_string_8_8: '{{ __sap_general_preconfigure_max_repo_type }}-'
__sap_general_preconfigure_max_repo_type_string_8_9: ''
__sap_general_preconfigure_max_repo_type_string_8_10: ''

__sap_general_preconfigure_max_repo_type_string: "{{ lookup('vars', '__sap_general_preconfigure_max_repo_type_string_' + ansible_facts['distribution_version'] | replace(\".\", \"_\")) }}"

__sap_general_preconfigure_req_os_repos:
  - rhel-{{ ansible_facts['distribution_major_version'] }}-for-{{ ansible_facts['architecture'] }}-baseos-{{ __sap_general_preconfigure_max_repo_type_string }}rpms
  - rhel-{{ ansible_facts['distribution_major_version'] }}-for-{{ ansible_facts['architecture'] }}-appstream-{{ __sap_general_preconfigure_max_repo_type_string }}rpms
__sap_general_preconfigure_req_netweaver_repos:
  - rhel-{{ ansible_facts['distribution_major_version'] }}-for-{{ ansible_facts['architecture'] }}-sap-netweaver-{{ __sap_general_preconfigure_max_repo_type_string }}rpms
__sap_general_preconfigure_req_hana_repos:
  - rhel-{{ ansible_facts['distribution_major_version'] }}-for-{{ ansible_facts['architecture'] }}-sap-solutions-{{ __sap_general_preconfigure_max_repo_type_string }}rpms
__sap_general_preconfigure_req_ha_repos:
  - rhel-{{ ansible_facts['distribution_major_version'] }}-for-{{ ansible_facts['architecture'] }}-highavailability-{{ __sap_general_preconfigure_max_repo_type_string }}rpms

__sap_general_preconfigure_envgroups:
  - "server-product-environment"

__sap_general_preconfigure_packagegroups_x86_64:
  - "@server"

__sap_general_preconfigure_packagegroups_ppc64le:
  - "@server"

__sap_general_preconfigure_packagegroups_s390x:
  - "@server"

__sap_general_preconfigure_packagegroups: "{{ lookup('vars', '__sap_general_preconfigure_packagegroups_' + ansible_facts['architecture']) }}"

__sap_general_preconfigure_packages_general:
  - uuidd
  - libnsl
  - tcsh
  - psmisc
  - sysstat
  - nfs-utils
  - bind-utils
  - compat-sap-c++-10
# English locale packages are required as per SAP note 2369910:
  - langpacks-en
  - glibc-langpack-en

__sap_general_preconfigure_packages_add_x86_64:
  - compat-sap-c++-9

__sap_general_preconfigure_packages_add_ppc64le:
  - compat-sap-c++-9

__sap_general_preconfigure_packages_add_s390x: []

__sap_general_preconfigure_packages: "{{ __sap_general_preconfigure_packages_general +
    lookup('vars', '__sap_general_preconfigure_packages_add_' + ansible_facts['architecture']) }}"

__sap_general_preconfigure_required_ppc64le:
  - ibm-power-managed-rhel8

__sap_general_preconfigure_kernel_parameters_default:
  - { name: vm.max_map_count, value: '2147483647' }
