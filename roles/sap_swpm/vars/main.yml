### Internal variables for SAP detection.

# Dictionary Matrix of product prefixes and sections combinations that must be enforced.
# This will ensure that required sections are present for specific products,
# while allowing other products to pass through and potentially fail during SWPM.
# NOTE: Dictionary contains variables that will be expanded only when accessed, which is after validation of inifile!
# - sections - list of sections that must be present in inifile for this product.
# - instances - list of dictionaries with 'number' and 'names' keys to define expected instance number and name format for the instance.
#   - number - unique instance number for the instance.
#   - names - list of possible instance names for the instance. Any of them means that the instance is detected.
__sap_swpm_product_sections_dict:
  # Product Catalog ID prefix.
  # Example: 'NW_ABAP_ASCS' for product catalog ID 'NW_ABAP_ASCS:S4HANA2025.CORE.HDB.ABAP'.
  # Contains: ASCS
  NW_ABAP_ASCS:
    # Name of section in 'sap_swpm_inifile_sections_list' that must be present for this product.
    sections:
      - nw_config_central_services_abap
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_ascs_instance_nr'] | d('') }}"
        names:
          - "{{ 'ASCS' ~ __sap_swpm_fact_vars['sap_swpm_ascs_instance_nr'] | d('') }}"

  # Contains: SCS
  NW_Java_SCS:
    sections:
      - nw_config_central_services_java
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_java_scs_instance_nr'] | d('') }}"
        names:
          - "{{ 'SCS' ~ __sap_swpm_fact_vars['sap_swpm_java_scs_instance_nr'] | d('') }}"

  # Contains: ERS
  NW_ERS:
    sections:
      - nw_config_ers
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_ers_instance_nr'] | d('') }}"
        names:
          - "{{ 'ERS' ~ __sap_swpm_fact_vars['sap_swpm_ers_instance_nr'] | d('') }}"

  # Contains: ASCS, PAS (ABAP)
  # DVEBMGS is used as fallback to legacy instance name.
  NW_ABAP_OneHost:
    sections:
      - nw_config_central_services_abap
      - nw_config_primary_application_server_instance
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_ascs_instance_nr'] | d('') }}"
        names:
          - "{{ 'ASCS' ~ __sap_swpm_fact_vars['sap_swpm_ascs_instance_nr'] | d('') }}"
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"
        names:
          - "{{ 'D' ~ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"
          - "{{ 'DVEBMGS' ~ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"

  # Contains: PAS
  NW_ABAP_CI:
    sections:
      - nw_config_primary_application_server_instance
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"
        names:
          - "{{ 'DVEBMGS' ~ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"
          - "{{ 'D' ~ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"

  # Contains: ASCS, PAS (JAVA)
  NW_Java_CI:
    sections:
      - nw_config_primary_application_server_instance
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"
        names:
          - "{{ 'J' ~ __sap_swpm_fact_vars['sap_swpm_pas_instance_nr'] | d('') }}"

  # Contains: AAS (ABAP or JAVA)
  NW_DI:
    sections:
      - nw_config_additional_application_server_instance
    instances:
      - number: "{{ __sap_swpm_fact_vars['sap_swpm_aas_instance_nr'] | d('') }}"
        names:
          - "{{ 'D' ~ __sap_swpm_fact_vars['sap_swpm_aas_instance_nr'] | d('') }}"
          - "{{ 'J' ~ __sap_swpm_fact_vars['sap_swpm_aas_instance_nr'] | d('') }}"


# This is special list of product prefixes, where we cannot detect SAP,
# because it does not create any recognizable files.
# NOTE: Do not add product prefixes already in '__sap_swpm_product_sections_dict'!
__sap_swpm_product_detection_unavailable:
  # List of product prefixes that cannot be allowed to proceed without explicit acknowledgement.
  fail: []

  # List of safe product prefixes that can be allowed to proceed without explicit acknowledgement.
  skip: []

  # Dedicated fail list for Database Load products, which are considered unsafe to proceed without explicit acknowledgement.
  # Database load installs only 'saphostctrl' and rest is done in database.
  # This is not conclusive enough for us to decide and SWPM handles this itself.
  dbload:
    - NW_ABAP_DB
    - NW_Java_DB


