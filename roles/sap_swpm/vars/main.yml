# Role variables used by each section in 'sap_swpm_inifile_sections_list', and their expected type.
# Variables of selected sections are validated before the inifile is generated.
# Value is either a type, or a dictionary with 'type' and optional conditions:
# - type:
#   - string - non-empty string.
#   - boolean - boolean.
#   - string_optional - string, validated only if not empty. Written into inifile even if empty.
#   - list - list, can be empty.
# - fallback - variable used when this variable is empty. Applied before validation.
# - when - boolean variable that must be true for this variable to be required.
# NOTE: Variable used in multiple sections is validated only once, using the strictest rule.
# NOTE: Sections without role variables are listed with empty dictionary, to keep list of all sections complete.
