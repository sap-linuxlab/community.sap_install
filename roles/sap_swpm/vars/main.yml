## Helper internal facts used for simplification and convenience within the role.
# All are expanded and consumed only after 'sap_swpm_fact_vars' is defined and validated.

# System ID (SID) in upper case.
__sap_swpm_sid: "{{ __sap_swpm_fact_vars['sap_swpm_sid'] | upper }}"

# Name of '<sid>adm' user.
__sap_swpm_sidadm_user: "{{ __sap_swpm_fact_vars['sap_swpm_sid'] | lower }}adm"

# Software Path, resolved from all sources.
__sap_swpm_software_path: "{{ __sap_swpm_fact_vars['sap_swpm_software_path'] }}"

# SAPCAR path, resolved from all sources. Software Path is used if it is not set.
__sap_swpm_sapcar_path: "{{ __sap_swpm_fact_vars['sap_swpm_sapcar_path'] }}"

# SWPM path, resolved from all sources. Software Path is used if it is not set.
__sap_swpm_path: "{{ __sap_swpm_fact_vars['sap_swpm_path'] }}"
