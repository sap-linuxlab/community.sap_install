# This is only step where we expose parsing mechanism if value was not found in the existing inifile.
- name: SAP SWPM - Existing Inifile - Show summary of parsed variables
  ansible.builtin.debug:
    msg: |
      INFO: Summary of parsed variables from existing inifile:
      {% if __sap_swpm_fact_vars['sap_swpm_software_path'] is defined %}
      - Software Path: '{{ __sap_swpm_fact_vars['sap_swpm_software_path'] }}'
      {% else %}
      - Software Path: Unable to find 'archives.downloadBasket' in the existing inifile.
      {% endif %}
      {% if __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] is defined %}
      - Product Catalog ID: '{{ __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] }}'
      {% else %}
      - Product Catalog ID: Unable to find 'Product ID is ' in the existing inifile.
      {% endif %}
      {% if __sap_swpm_fact_vars['sap_swpm_sid'] is defined %}
      - SID: '{{ __sap_swpm_fact_vars['sap_swpm_sid'] }}'
      {% else %}
      - SID: Unable to find 'NW_GetSidNoProfiles.sid' in the existing inifile.
      {% endif %}
      {% if __sap_swpm_fact_vars['sap_swpm_fqdn'] is defined %}
      - FQDN: '{{ __sap_swpm_fact_vars['sap_swpm_fqdn'] }}'
      {% else %}
      - FQDN: Unable to find 'NW_getFQDN.FQDN' in the existing inifile.
      {% endif %}
