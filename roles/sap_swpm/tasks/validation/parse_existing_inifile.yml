---

# This file extracts key information from the existing inifile, such as Software Path, Product ID, and SID.
# There is potential to add more extraction blocks if required.
# NOTE: Block with vars are used to remove need to reset those facts.

# Limited to certain key facts are required when existing inifile is used.
# - sap_swpm_software_path
# - sap_swpm_product_catalog_id
# - sap_swpm_sid
# - sap_swpm_fqdn


- name: SAP SWPM - Existing Inifile - Read inifile.params file
  ansible.builtin.slurp:
    path: "{{ __sap_swpm_fact_inifile_params_path }}"
  register: __sap_swpm_register_inifile_slurp


- name: SAP SWPM - Existing Inifile - Fail if uncommented des25 lines are found
  ansible.builtin.fail:
    msg: |
      FAIL: Found {{ __count_des25 }} uncommented des25 lines in the inifile.
      Please remove or comment out these lines before reusing the inifile.
      See SAP note 2609804 for more information.
  vars:
    # Ignores comment likes and count only uncommented 'des25' lines.
    __count_des25: >-
      {{
        (__sap_swpm_register_inifile_slurp.content | b64decode).splitlines()
        | reject('match', '^\s*#')
        | select('search', 'des25\(')
        | list
        | length
      }}
  when: __count_des25 | int > 0


## Software Path (sap_swpm_software_path)
# Finds Software Path line generated by jinja2 with templating logic:
# 1. Find first uncommented line with 'archives.downloadBasket'.
# 2. Replace 'archives.downloadBasket' and everything before with ''.
# 3. Extract the Software Path value.
# Example: archives.downloadBasket = /software/

- name: Block to parse Software Path
  vars:
    __inifile_software_path: >-
      {{
        ((__sap_swpm_register_inifile_slurp.content | b64decode).splitlines()
        | reject('match', '^\s*#')
        | select('search', 'archives\.downloadBasket')
        | first
        | default(''))
        | regex_replace('^.*archives\.downloadBasket\s*=\s*', '')
        | trim
      }}
  when: __inifile_software_path | length > 0
  block:

    - name: SAP SWPM - Existing Inifile - Warning if Software Path mismatch was detected
      ansible.builtin.debug:
        msg: |
          WARN: The Software Path is not consistent between:
          - File '{{ __sap_swpm_fact_inifile_params_path }}': {{ __inifile_software_path }}
          - Variable 'sap_swpm_software_path': '{{ sap_swpm_software_path }}'
          {% if __sap_swpm_fact_vars['sap_swpm_software_path'] is not defined %}
          Value from inifile will be used due to precedence.
          {% endif %}
      when:
        - sap_swpm_software_path is defined
        - sap_swpm_software_path is string
        - sap_swpm_software_path | trim | length > 0
        # NOTE: We are not comparing internal fact, but user variable.
        - __inifile_software_path != sap_swpm_software_path

    - name: SAP SWPM - Existing Inifile - Set fact with Software Path
      ansible.builtin.set_fact:
        __sap_swpm_fact_vars:
          "{{ __sap_swpm_fact_vars | combine({'sap_swpm_software_path': __inifile_software_path}) }}"
      when: __sap_swpm_fact_vars['sap_swpm_software_path'] is not defined
      no_log: true  # Any set_fact will show full content in verbose mode, including sensitive information.


## Product ID (sap_swpm_product_catalog_id)
# Finds Product ID line generated by jinja2 with templating logic:
# 1. Find first line with 'Product ID is '.
# 2. Replace 'Product ID is ' and everything before with ''.
# 3. Extract the Product ID value.
# Example: ### inifile.params generated for SWPM - Product ID is NW_ABAP_CI:BW4HANA2023.CORE.HDB.ABAP
# NOTE: If template line for Product ID is updated, this detection logic may need to be updated accordingly.

- name: Block to parse Product ID
  vars:
    __inifile_product_id: >-
      {{
        ((__sap_swpm_register_inifile_slurp.content | b64decode).splitlines()
        | select('search', 'Product ID is ', ignorecase=True)
        | first
        | default('')
        | regex_replace('^.*Product ID is\s+', ''))
        | trim
      }}
  when: __inifile_product_id | length > 0
  block:

    - name: SAP SWPM - Existing Inifile - Warning if Product ID mismatch was detected
      ansible.builtin.debug:
        msg: |
          WARN: The Product ID is not consistent between:
          - File '{{ __sap_swpm_fact_inifile_params_path }}': {{ __inifile_product_id }}
          - Variable 'sap_swpm_product_catalog_id': '{{ sap_swpm_product_catalog_id }}'
          {% if __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] is not defined %}
          Value from inifile will be used due to precedence.
          {% endif %}
      when:
        - sap_swpm_product_catalog_id is defined
        - sap_swpm_product_catalog_id is string
        - sap_swpm_product_catalog_id | trim | length > 0
        # NOTE: We are not comparing internal fact, but user variable.
        - __inifile_product_id != sap_swpm_product_catalog_id

    - name: SAP SWPM - Existing Inifile - Set fact with SAP product ID
      ansible.builtin.set_fact:
        __sap_swpm_fact_vars: "{{ __sap_swpm_fact_vars | combine({'sap_swpm_product_catalog_id': __inifile_product_id}) }}"
      when: __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] is not defined
      no_log: true  # Any set_fact will show full content in verbose mode, including sensitive information.


