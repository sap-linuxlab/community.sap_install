---

# Assert the virtual hostname resolution for HA.

- name: SAP SWPM - HA hostname - Ensure the dig command is present
  ansible.builtin.package:
    name: bind-utils
    state: present

- name: SAP SWPM - HA hostname - Try to resolve sap_swpm_virtual_hostname from DNS
  ansible.builtin.command:
    cmd: dig +short +tries=1 +time=1 "{{ __sap_swpm_fact_vars['sap_swpm_virtual_hostname'] }}"
  register: __sap_swpm_register_virtual_ip_dns
  changed_when: false
  failed_when: false

- name: SAP SWPM - HA hostname - Assign sap_swpm_virtual_ip from DNS
  ansible.builtin.set_fact:
    __sap_swpm_fact_virtual_ip: "{{ __sap_swpm_register_virtual_ip_dns.stdout_lines[-1] }}"
  when: __sap_swpm_register_virtual_ip_dns.stdout_lines | length > 0

- name: Block when sap_swpm_virtual_hostname cannot be resolved from DNS
  when: __sap_swpm_register_virtual_ip_dns.stdout_lines | length == 0
  block:

    # We assign the IP address only if there is exactly one line containing ipv4 and hostname:
    - name: SAP SWPM - HA hostname - Try to resolve sap_swpm_virtual_hostname from /etc/hosts
      ansible.builtin.shell:
        cmd: |
          awk 'BEGIN{a=0}/^[^#]/&&(/\s{{ __hostname }}\./||/\s{{ __hostname }}/){a++; ipaddr=$1}END{if(a==1){print ipaddr}}' /etc/hosts
      vars:
        __hostname: "{{ __sap_swpm_fact_vars['sap_swpm_virtual_hostname'] }}"
      register: __sap_swpm_register_virtual_ip_etc_hosts
      changed_when: false
      failed_when: false

    - name: SAP SWPM - HA hostname - Assign sap_swpm_virtual_ip from /etc/hosts
      ansible.builtin.set_fact:
        __sap_swpm_fact_virtual_ip: "{{ __sap_swpm_register_virtual_ip_etc_hosts.stdout_lines[-1] }}"
      when: __sap_swpm_register_virtual_ip_etc_hosts.stdout_lines | length > 0

- name: SAP SWPM - HA hostname - Fail if sap_swpm_virtual_hostname cannot be resolved
  ansible.builtin.fail:
    msg: "FAIL: 'sap_swpm_virtual_hostname' is not defined, cannot be resolved, or has multiple entries in /etc/hosts!"
  when: __sap_swpm_fact_virtual_ip | length == 0

- name: SAP SWPM - HA hostname - Fail if the IP address of sap_swpm_virtual_hostname is not assigned to the host
  ansible.builtin.fail:
    msg: |
      FAIL: The IP address {{ __sap_swpm_fact_virtual_ip }} of 'sap_swpm_virtual_hostname'
      is not assigned to any interface of the managed host!
  when: __sap_swpm_fact_virtual_ip not in ansible_facts['all_ipv4_addresses']
