---

# Validates the SAP Maintenance Planner Stack XML and prepares it for SWPM.
# This file is included only if 'sap_swpm_mp_stack_path' is set, regardless of the installation type.
# Empty variables are not in '__sap_swpm_fact_vars', so 'sap_swpm_mp_stack_file_name' is undefined when it is not set.

- name: Block for shared variables for mp stack
  vars:
    __mp_stack_path: "{{ __sap_swpm_fact_vars['sap_swpm_mp_stack_path'] }}"
    __mp_stack_file_name: "{{ __sap_swpm_fact_vars['sap_swpm_mp_stack_file_name'] | d('') }}"
  block:

    - name: SAP SWPM - Install Type - MP Stack - Fail if the path or the file name is not a string
      ansible.builtin.fail:
        msg: |
          FAIL: The variables 'sap_swpm_mp_stack_path' and 'sap_swpm_mp_stack_file_name' must be strings.
      when: __mp_stack_path is not string or __mp_stack_file_name is not string

    - name: SAP SWPM - Install Type - MP Stack - Check the path of the stack XML directory
      ansible.builtin.stat:
        path: "{{ __mp_stack_path }}"
      register: __sap_swpm_register_mp_stack_path_stat

    - name: SAP SWPM - Install Type - MP Stack - Fail if the path of the stack XML directory is not a directory
      ansible.builtin.fail:
        msg: "FAIL: The variable 'sap_swpm_mp_stack_path' does not specify an existing directory: '{{ __mp_stack_path }}'"
      when: not (__sap_swpm_register_mp_stack_path_stat.stat.exists
              and __sap_swpm_register_mp_stack_path_stat.stat.isdir)

    # Stack XML is searched only if its name is not defined.
    - name: SAP SWPM - Install Type - MP Stack - Search for MP*.xml file in the stack path
      ansible.builtin.find:
        paths: "{{ __mp_stack_path }}"
        patterns: 'MP*.xml'
        file_type: file
      register: __sap_swpm_register_mp_stack_find
      when: __mp_stack_file_name | length == 0

    - name: SAP SWPM - Install Type - MP Stack - Fail if exactly one MP*.xml file was not found
      ansible.builtin.fail:
        msg: |
          FAIL: Expected exactly one 'MP*.xml' file in '{{ __mp_stack_path }}', but found {{ __sap_swpm_register_mp_stack_find.matched }}.
          Define the variable 'sap_swpm_mp_stack_file_name' to select the stack XML file.
      when:
        - __mp_stack_file_name | length == 0
        - __sap_swpm_register_mp_stack_find.matched != 1


    # Check the existence of user provided 'sap_swpm_mp_stack_file_name'
    - name: Block for user provided 'sap_swpm_mp_stack_file_name'
      when: __mp_stack_file_name | length > 0
      block:
        - name: SAP SWPM - Install Type - MP Stack - Check the existence of the stack XML file
          ansible.builtin.stat:
            path: "{{ (__mp_stack_path ~ '/' ~ __mp_stack_file_name) | regex_replace('//*', '/') }}"
          register: __sap_swpm_register_mp_stack_file_stat

        - name: SAP SWPM - Install Type - MP Stack - Fail if the file of the stack XML does not exist
          ansible.builtin.fail:
            msg: "FAIL: The stack XML file defined in 'sap_swpm_mp_stack_file_name' was not found in '{{ __mp_stack_path
              }}': '{{ __mp_stack_file_name }}'"
          when:
            - not (__sap_swpm_register_mp_stack_file_stat.stat.exists
                and __sap_swpm_register_mp_stack_file_stat.stat.isreg)


    - name: SAP SWPM - Install Type - MP Stack - Set facts with the stack XML
      ansible.builtin.set_fact:
        __sap_swpm_fact_mp_stack_xml: "{{ __mp_stack_xml }}"
        __sap_swpm_fact_command_mp_stack: "SAPINST_STACK_XML={{ __mp_stack_xml }}"
        __sap_swpm_fact_installation_header: >-
          {{ 'High Availability Installation using virtual hostname and SAP Maintenance Planner Stack XML'
            if __sap_swpm_fact_installation_type == 'ha'
            else 'Installing using SAP Maintenance Planner Stack XML' }}
      vars:
        # Combine path if user provided, otherwise use the first found stack XML file
        __mp_stack_xml: >-
          {{ (__mp_stack_path ~ '/' ~ __mp_stack_file_name) | regex_replace('//*', '/')
            if __mp_stack_file_name | length > 0
            else __sap_swpm_register_mp_stack_find.files[0].path }}

    - name: SAP SWPM - Install Type - MP Stack - Show the stack XML
      ansible.builtin.debug:
        msg: "SAP Maintenance Planner Stack XML is {{ __sap_swpm_fact_mp_stack_xml }}"

    - name: SAP SWPM - Install Type - MP Stack - Ensure SAP System ID is correct inside Stack XML - Constraint tag
      ansible.builtin.replace:
        path: "{{ __sap_swpm_fact_mp_stack_xml }}"
        regexp: '<constraint name="sid" value="([A-Z][0-9])\w"'
        replace: '<constraint name="sid" value="{{ __sap_swpm_sid }}"'

    - name: SAP SWPM - Install Type - MP Stack - Ensure SAP System ID is correct inside Stack XML - SID tag
      ansible.builtin.replace:
        path: "{{ __sap_swpm_fact_mp_stack_xml }}"
        regexp: '<sid>([A-Z][0-9])\w'
        replace: '<sid>{{ __sap_swpm_sid }}'
