---

# Copy password file to the same location as inifile.params
# NOTE: Empty variables are not in '__sap_swpm_fact_vars', so 'sap_swpm_password_file_path' is defined only if it is set.
# The value is checked to be boolean here, because it can come from sources other than role variables.
- name: Block for password file
  when:
    - __sap_swpm_fact_vars['sap_swpm_use_password_file'] is boolean
    - __sap_swpm_fact_vars['sap_swpm_use_password_file']
  block:

    - name: SAP SWPM - Prepare SWPM - Fail if the password file path is not defined
      ansible.builtin.fail:
        msg: "FAIL: The variable 'sap_swpm_password_file_path' must be defined when 'sap_swpm_use_password_file' is true."
      when: __sap_swpm_fact_vars['sap_swpm_password_file_path'] is not defined

    - name: SAP SWPM - Prepare SWPM - Copy password file to the same location as inifile.params
      ansible.builtin.copy:
        src: "{{ __sap_swpm_fact_vars['sap_swpm_password_file_path'] }}/instkey.pkey"
        dest: "{{ __sap_swpm_register_tmpdir.path }}/instkey.pkey"
        remote_src: true
        mode: '0640'


# Create the SWPM inifile
- name: SAP SWPM - Prepare SWPM - Generate the SWPM inifile
  ansible.builtin.include_tasks:
    file: generate_inifile.yml
  tags: sap_swpm_generate_inifile


# Detect running SAP instances using variables validated in tasks above.
# NOTE: This will result in skipping of remaining tasks, unless force is used.
- name: Block for SAP Detection
  # Inherited tags are explicitly declared here to ensure this inclusion
  # is skipped (and logs are hidden) when only sub-tags like 'sap_swpm_generate_inifile' are requested.
  tags:
    - sap_swpm_pre_install
    - sap_swpm_install
  block:
    - name: SAP SWPM - Prepare SWPM - Skip all detection checks
      ansible.builtin.debug:
        msg: |
          WARN: Detection checks are SKIPPED because 'sap_swpm_skip_detection' is set to 'true'.

          This bypasses all safety mechanisms that prevent installation over existing SAP systems.
          Use this ONLY for testing/development on clean systems.

          Proceeding with installation without any detection checks.
      when: sap_swpm_skip_detection | d(false)

    - name: SAP SWPM - Prepare SWPM - Prepare variables for SAP detection
      ansible.builtin.include_tasks:
        file: detect_sap_prepare.yml
      when: not sap_swpm_skip_detection | d(false)

    - name: SAP SWPM - Prepare SWPM - Detect running SAP instances
      ansible.builtin.include_tasks:
        file: detect_sap.yml
      when:
        - not sap_swpm_skip_detection | d(false)
        - __sap_swpm_fact_detect_instances | length > 0


- name: Block to execute only if SAP instance is not detected or in force mode.
  when: not __sap_swpm_fact_sap_detected or sap_swpm_force
  block:

    # Determine Installation Type, e.g. System Copy, HA, Maintenance Planner, ...
    - name: SAP SWPM - Prepare SWPM - Determine Installation Type
      ansible.builtin.include_tasks:
        file: install_type.yml
    #    apply:
    #      tags: sap_swpm_generate_inifile
    #  tags: sap_swpm_generate_inifile

    # Requires variables:
    # - __sap_swpm_software_path (e.g. /software/download_basket)
    # - __sap_swpm_sapcar_path (e.g. /software/sapcar)
    # - __sap_swpm_path (e.g. /software/swpm)
    # Prepare Software
    - name: SAP SWPM - Prepare SWPM - Prepare Software
      ansible.builtin.include_tasks:
        file: prepare_software.yml
      when: sap_swpm_run_sapinst

    # Set fact for SWPM path
    - name: SAP SWPM - Prepare SWPM - Set fact for SWPM path when extract directory defined
      ansible.builtin.set_fact:
        __sap_swpm_fact_sapinst_path: "{{ __sap_swpm_fact_vars['sap_swpm_software_extract_directory'] }}"
      when:
        - sap_swpm_run_sapinst
        - __sap_swpm_fact_vars['sap_swpm_software_extract_directory'] is defined

    # Set fact for SWPM path
    - name: SAP SWPM - Prepare SWPM - Set fact for SWPM path when undefined extract directory
      ansible.builtin.set_fact:
        __sap_swpm_fact_sapinst_path: "{{ (__sap_swpm_path | regex_replace('\\/$', '')) + '/extracted' }}"
      when:
        - sap_swpm_run_sapinst
        - __sap_swpm_fact_vars['sap_swpm_software_extract_directory'] is not defined

    - name: SAP SWPM - Prepare SWPM - Ensure sapinst directory exists
      ansible.builtin.file:
        path: "{{ __sap_swpm_fact_sapinst_path }}"
        state: directory
        mode: '0755'
      when: sap_swpm_run_sapinst

    # Extract SWPM
    # NOTE: Folded scalar '>' joins lines with spaces, so no line-continuation backslashes '\' are needed.
    #       With 'cmd' they reach the shell literally and break the paths (legacy free-form parsing silently dropped them).
    - name: SAP SWPM - Prepare SWPM - Extract SWPM
      ansible.builtin.command:
        cmd: >-
          {{ __sap_swpm_sapcar_path }}/{{ __sap_swpm_fact_sapcar_file_name }}
          -xvf {{ __sap_swpm_path }}/{{ __sap_swpm_fact_swpm_file_name }}
          -manifest SIGNATURE.SMF
      register: __sap_swpm_register_extract_swpm
      args:
        chdir: "{{ __sap_swpm_fact_sapinst_path }}"
      changed_when: "'SAPCAR: processing archive' in __sap_swpm_register_extract_swpm.stdout"
      when: sap_swpm_run_sapinst
