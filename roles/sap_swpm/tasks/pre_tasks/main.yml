---

# Validate if provided 'sap_swpm_virtual_hostname' can be recognized on managed host when:
# - sapinst is requested to be run, and
# - /etc/hosts file is requested to be updated, and
# - sap_swpm_virtual_hostname has been defined
- name: SAP SWPM - Pre Tasks - Assert hostname resolution for HA
  ansible.builtin.import_tasks:
    file: assert_hostname_resolution_for_ha.yml
  when:
    - sap_swpm_run_sapinst
    - sap_swpm_update_etchosts
    - __sap_swpm_fact_vars['sap_swpm_virtual_hostname'] is defined
  tags: sap_swpm_update_etchosts


# Temporary directory for files created by the role, like inifile and password file.
# It is removed at the end of the role in 'post_tasks/cleanup.yml', after the inifile is preserved.
- name: SAP SWPM - Pre Tasks - Create temporary directory on managed node
  ansible.builtin.tempfile:
    state: directory
    suffix: _swpm
  register: __sap_swpm_register_tmpdir
  tags:
    - sap_swpm_generate_inifile
    - sap_swpm_sapinst_commandline


# Run Pre-installation Steps Based on Run Mode
# NOTE: This task file includes SAP detection logic, which will be skipped for these tags.
- name: SAP SWPM - Pre Tasks - Run Pre-installation Steps
  ansible.builtin.include_tasks:
    file: swpm_prepare.yml
  tags:
    - sap_swpm_generate_inifile
    - sap_swpm_sapinst_commandline

- name: Block to execute on empty host or in force mode
  when: not __sap_swpm_fact_sap_detected or sap_swpm_force
  block:

    ## Pre Install Optional Tasks
    # Firewall
    - name: SAP SWPM - Pre Tasks - Configure Firewall
      ansible.builtin.include_tasks:
        file: firewall.yml
        # Apply is required when include_tasks is used instead of import_tasks.
        apply:
          tags: sap_swpm_configure_firewall
      when:
        - sap_swpm_configure_firewall
      tags: sap_swpm_configure_firewall

    # /etc/hosts
    - name: SAP SWPM - Pre Tasks - Update /etc/hosts
      ansible.builtin.include_tasks:
        file: update_etchosts.yml
        # Apply is required when include_tasks is used instead of import_tasks.
        apply:
          tags: sap_swpm_update_etchosts
      when:
        - sap_swpm_run_sapinst
        - sap_swpm_update_etchosts
      tags: sap_swpm_update_etchosts


    # Display Parameters
    # Software files are only detected in 'prepare_software.yml' when 'sap_swpm_run_sapinst' is 'true'.
    - name: SAP SWPM - Pre Tasks - Display Software
      ansible.builtin.debug:
        msg: |
          {% if sap_swpm_run_sapinst %}
          SAPCAR:     {{ __sap_swpm_sapcar_path }}: {{ __sap_swpm_fact_sapcar_file_name }}
          SWPM:       {{ __sap_swpm_path }}: {{ __sap_swpm_fact_swpm_file_name }}
          {% if not sap_swpm_generic %}
          SAPEXEDB:   {{ __sap_swpm_software_path }}: {{ __sap_swpm_register_sapexedb_files.files | map(attribute='path') | map('basename') | join(', ') }}
          SAPEXE:     {{ __sap_swpm_software_path }}: {{ __sap_swpm_register_sapexe_files.files | map(attribute='path') | map('basename') | join(', ') }}
          IGS:        {{ __sap_swpm_software_path }}: {{ __sap_swpm_register_igs_exe_files.files | map(attribute='path') | map('basename') | join(', ') }}
          IGS Helper: {{ __sap_swpm_software_path }}: {{ __sap_swpm_register_igs_helper_files.files | map(attribute='path') | map('basename') | join(', ') }}
          {% endif %}
          {% if 'Webdispatcher' in __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] %}
          WEBDISP:    {{ __sap_swpm_software_path }}: {{ __sap_swpm_register_sapwebdisp_files.files | map(attribute='path') | map('basename') | join(', ') }}
          {% endif %}
          {% else %}
          File detection was skipped because the variable 'sap_swpm_run_sapinst' is set to 'false'.
          {% endif %}
          {% if __sap_swpm_fact_mp_stack_xml | length > 0 %}
          MP Stack:   {{ __sap_swpm_fact_mp_stack_xml }}
          {% endif %}
          {% if __sap_swpm_fact_vars['sap_swpm_backup_location'] is defined %}
          Backup:     {{ __sap_swpm_fact_vars['sap_swpm_backup_location'] }}
          {% endif %}


    # Directory where sapinst creates its 'sapinst_instdir' with logs, which sapinst takes from the environment variable 'TMP'.
    - name: SAP SWPM - Pre Tasks - Set fact with the sapinst temporary directory
      ansible.builtin.set_fact:
        __sap_swpm_fact_sapinst_tempdir: "{{ (__sap_swpm_fact_vars['sap_swpm_env_vars'] | d({}))['TMP'] | d('/tmp') }}"

    - name: SAP SWPM - Pre Tasks - Installation Process
      ansible.builtin.debug:
        msg: |
          Ready to run SWPM for SAP Software Installation

          - SAP Product        -       {{ __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] }}
          - SID                -       {{ __sap_swpm_fact_vars['sap_swpm_sid'] }}
          - Host               -       {{ ansible_facts['hostname'] }}

          - The installation can take up to 3 hours. Run the following command as root
          - on {{ ansible_facts['hostname'] }} to display the installation logs:
          - tail -f $(cat {{ __sap_swpm_fact_sapinst_tempdir }}/sapinst_instdir/.lastInstallationLocation)/sapinst.log


    # NOTE: 'sap_swpm_umask' is undocumented and it does not have default in 'defaults/main.yml'.
    # NOTE: 'sap_swpm_command_extra_args' is never validated.

    # Original string concatenation with empty strings did not remove empty spaces,
    # resulting in redundant spaces in the command line and decreased readability.
    # List is used instead and empty items are dropped by 'select' when the command line is joined.
    - name: SAP SWPM - Pre Tasks - Set fact for the sapinst command line
      ansible.builtin.set_fact:
        __sap_swpm_fact_sapinst_command: >-
          umask {{ __sap_swpm_fact_vars['sap_swpm_umask'] | d('022') }} ;
          ./sapinst {{ (__main_args + __extra_args) | select | join(' ') }}
      vars:
        # List of main arguments for the sapinst command line.
        __inifile_arg:
          "SAPINST_INPUT_PARAMETERS_URL={{ __sap_swpm_register_tmpdir.path }}/inifile.params"
        __product_id_arg:
          "SAPINST_EXECUTE_PRODUCT_ID={{ __sap_swpm_fact_vars['sap_swpm_product_catalog_id'] }}"
        __crlbag_arg:
          "{{ 'SAPINST_CRL_PATH=' + __sap_swpm_fact_vars['sap_swpm_crlbag_path']
            if __sap_swpm_fact_vars['sap_swpm_crlbag_path'] is defined else '' }}"
        __main_args:
          - "{{ __inifile_arg }}"
          - "{{ __product_id_arg }}"
          - "{{ __crlbag_arg }}"

        # Helper facts to shorten line lengths.
        __observer_mode: "{{ __sap_swpm_fact_vars['sap_swpm_observer_mode'] | d(false) }}"
        __remote_access_user: "{{ __sap_swpm_fact_vars['sap_swpm_remote_access_user'] | d('') }}"

        # Extra arguments for the sapinst command line.
        __gui_server_extra_arg: "{{ 'SAPINST_START_GUISERVER=false' if not __observer_mode else '' }}"
        __observer_extra_arg:
          "{{ 'SAPINST_REMOTE_ACCESS_USER=' + __remote_access_user + ' SAPINST_REMOTE_ACCESS_USER_IS_TRUSTED=true'
            if __observer_mode and __remote_access_user | length > 0 else '' }}"

        # Default mode disables GUI server and observer mode unless explicitly set together with its user.
        # Virtual hostname is used in HA installations with 'SAPINST_USE_HOSTNAME' and 'IS_HOST_LOCAL_USING_STRING_COMPARE=true' arguments, otherwise it is empty.
        # Maintenance Planner stack XML is used with 'SAPINST_STACK_XML' parameter, otherwise it is empty.
        # User defined 'sap_swpm_command_extra_args' is a string, but we do not validate its content.
        # List of extra arguments for the sapinst command line.
        __extra_args:
          - "SAPINST_SKIP_DIALOGS=true"
          - "{{ __gui_server_extra_arg }}"
          - "{{ __observer_extra_arg }}"
          - "{{ __sap_swpm_fact_command_virtual_hostname }}"
          - "{{ __sap_swpm_fact_command_mp_stack }}"
          - "{{ __sap_swpm_fact_vars['sap_swpm_command_extra_args'] | d('') }}"

      tags: sap_swpm_sapinst_commandline


    # Debug output is using pipe to remove extra quotes that would interfere with readability.
    - name: SAP SWPM - Pre Tasks - Display the sapinst command line
      ansible.builtin.debug:
        msg: |
          SAP SWPM install command: '{{ __sap_swpm_fact_sapinst_command }}'
      tags: sap_swpm_sapinst_commandline
