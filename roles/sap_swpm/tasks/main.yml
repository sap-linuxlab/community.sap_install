---

# Example of files loading order:
# 1. Suse.yml / RedHat.yml - Specific to OS family.
# 2. SLES_15.yml / RedHat_9.yml - Specific to distribution (SLES, SLES_SAP or RedHat) and major release.
# 3. SLES_15.6.yml / RedHat_9.2 - Specific to distribution (SLES, SLES_SAP or RedHat) and minor release.
# 4. SLES_SAP_15.yml - Specific to distribution SLES_SAP and major release.
# 5. SLES_SAP_15.6.yml - Specific to distribution SLES_SAP and minor release.
- name: SAP SWPM - Include OS specific vars
  ansible.builtin.include_vars: "{{ __vars_file }}"
  loop: "{{ __var_files }}"
  vars:
    __vars_file: "{{ role_path }}/vars/{{ item }}"
    __distribution_major: "{{ ansible_facts['distribution'] ~ '_' ~ ansible_facts['distribution_major_version'] }}"
    __distribution_minor: "{{ ansible_facts['distribution'] ~ '_' ~ ansible_facts['distribution_version'] }}"
    # Enables loading of shared vars between SLES and SLES_SAP
    __distribution_major_split: "{{ ansible_facts['distribution'].split('_')[0] ~ '_' ~ ansible_facts['distribution_major_version'] }}"
    __distribution_minor_split: "{{ ansible_facts['distribution'].split('_')[0] ~ '_' ~ ansible_facts['distribution_version'] }}"
    __var_files: >-
      {{
        [
          ansible_facts['os_family'] ~ '.yml',
          (ansible_facts['distribution'] ~ '.yml') if ansible_facts['distribution'] != ansible_facts['os_family'] else None,
          (__distribution_major_split ~ '.yml') if __distribution_major_split != __distribution_major else None,
          (__distribution_minor_split ~ '.yml') if __distribution_minor_split != __distribution_minor else None,
          __distribution_major ~ '.yml',
          __distribution_minor ~ '.yml'
        ] | select('defined') | select('string') | list
      }}
  when: __vars_file is file
  tags: always


# Tags are not used, because validation must validate variables in all cases.
- name: SAP SWPM - Prepare and validate variables
  ansible.builtin.import_tasks:
    file: validation/main.yml
  tags: always


- name: SAP SWPM - Block for tasks using the temporary directory
  block:

    - name: SAP SWPM - Preparation tasks before installation
      ansible.builtin.import_tasks:
        file: pre_tasks/main.yml
      tags:
        - sap_swpm_pre_install
        - sap_swpm_install

    - name: SAP SWPM - Execute SWPM
      ansible.builtin.import_tasks:
        file: swpm.yml
      when:
        - sap_swpm_run_sapinst
        - not __sap_swpm_fact_sap_detected or sap_swpm_force
      tags:
        - sap_swpm_install

    - name: SAP SWPM - Preparation tasks after installation
      ansible.builtin.import_tasks:
        file: post_tasks/main.yml
      when: sap_swpm_run_sapinst

  rescue:

    # The failed task is recorded and the failure is raised again after the cleanup,
    # so that the failed task is the last output and the cleanup output does not hide it.
    - name: SAP SWPM - Set the facts of the failed task
      ansible.builtin.set_fact:
        __sap_swpm_fact_failed_task: "{{ ansible_failed_task.name | d('unknown task') }}"
        __sap_swpm_fact_failed_message: "{{ ansible_failed_result.msg | d('') }}"
      tags: always

  always:

    # Apply 'always' ensures the cleanup is executed, regardless of the tags used in the run.
    - name: SAP SWPM - Cleanup
      ansible.builtin.include_tasks:
        file: post_tasks/cleanup.yml
        apply:
          tags: always
      tags: always

    # Fail based on the facts set in the rescue section, after the cleanup was executed.
    - name: SAP SWPM - Fail if the role did not complete
      ansible.builtin.fail:
        msg: |
          FAIL: The role failed in the task '{{ __sap_swpm_fact_failed_task }}'.
          {% if __sap_swpm_fact_failed_message | length > 0 %}
          {{ __sap_swpm_fact_failed_message }}
          {% else %}
          The task returned no message.
          It was either failed by its 'failed_when' condition or it did not provide any message.
          {% endif %}
      when: __sap_swpm_fact_failed_task | length > 0
      tags: always
