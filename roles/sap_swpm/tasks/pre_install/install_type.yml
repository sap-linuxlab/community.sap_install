---

################
# Determine Installation Type
################

# Ignore Product IDs for SAP NetWeaver 7.5 Java standalone:
# - Advanced Adapter Engine (AE) with .AE .AEHA
# - Advanced Adapter Engine Extended (AEX) with .AEX .AEXHA
# - Process Integration / Process Orchestration (PI/PO) with .PI .PIHA .PIABAP .PIABAPHA .PIJAVA .PIJAVAHA

- name: SAP SWPM Pre Install - Check if System Copy (Backup/Restore)
  ansible.builtin.set_fact:
    __sap_swpm_fact_installation_type: "restore"
    __sap_swpm_fact_installation_header: "System Copy restore from backup"
  when: "'.CP' in sap_swpm_product_catalog_id | string"

- name: SAP SWPM Pre Install - Check if SAP High Availability installation
  ansible.builtin.set_fact:
    __sap_swpm_fact_installation_type: "ha"
    __sap_swpm_fact_installation_header: "High Availability Installation using virtual hostname"
  when: "'.ABAPHA' in sap_swpm_product_catalog_id | string or
         '.HA' in sap_swpm_product_catalog_id | string or
         '.HACP' in sap_swpm_product_catalog_id | string"

- name: SAP SWPM Pre Install - Check if installation using SAP Maintenance Planner
  ansible.builtin.set_fact:
    __sap_swpm_fact_installation_type: "maint_plan_stack"
    __sap_swpm_fact_installation_header: "Installing using SAP Maintenance Planner Stack XML"
  when:
    - sap_swpm_mp_stack_path is defined
    - sap_swpm_mp_stack_path is string
    - sap_swpm_mp_stack_path | trim | length > 0

- name: SAP SWPM Pre Install - Check if SAP High Availability installation and using SAP Maintenance Planner
  ansible.builtin.set_fact:
    __sap_swpm_fact_installation_type: "ha_maint_plan_stack"
    __sap_swpm_fact_installation_header: "High Availability Installation using virtual hostname and SAP Maintenance Planner Stack XML"
  when:
    - "'.ABAPHA' in sap_swpm_product_catalog_id | string"
    - sap_swpm_mp_stack_path is defined
    - sap_swpm_mp_stack_path is string
    - sap_swpm_mp_stack_path | trim | length > 0

################
# Run Installation Type Steps
################

- name: SAP SWPM Pre Install - Assert supported installation types
  ansible.builtin.assert:
    that:
      - __sap_swpm_fact_installation_type is string
      - __sap_swpm_fact_installation_type in ['', 'restore', 'ha', 'maint_plan_stack', 'ha_maint_plan_stack']
    fail_msg: |
      FAIL: Manual change of internal variable was detected!
      The variable '__sap_swpm_fact_installation_type' allows only following options:
      - '' (empty string, the default)
      - 'restore'
      - 'ha'
      - 'maint_plan_stack'
      - 'ha_maint_plan_stack'

- name: SAP SWPM Pre Install - Assert that necessary variable for HA is defined
  ansible.builtin.assert:
    that: sap_swpm_virtual_hostname is defined and sap_swpm_virtual_hostname | length > 0
    fail_msg: "FAIL: 'sap_swpm_virtual_hostname' is not defined or is defined with an empty string!"
    success_msg: "PASS: 'sap_swpm_virtual_hostname' is defined, as '{{ sap_swpm_virtual_hostname }}'."
  when:
    - __sap_swpm_fact_installation_type is search('ha')

################
# Installation Type file will not be included if install type is empty (= the default):
################

- name: SAP SWPM Pre Install - Run Installation Type Steps
  ansible.builtin.include_tasks: "install_type/{{ __sap_swpm_fact_installation_type }}_install.yml"
  when: "__sap_swpm_fact_installation_type | length > 0"
