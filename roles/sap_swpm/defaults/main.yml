### SWPM Observer Mode Variables (Experimental) ###############################
# Set to 'true' to enable SWPM observer mode for debugging or troubleshooting (Boolean).
# This allows user to watch the installation progress from a browser (on standard port 4237) interactively.
# NOTE: This is not intended use and interaction can impact the automated installation, resulting in unexpected issues.
sap_swpm_observer_mode: false

# The name of the remote access user for SWPM observer mode (String).
# Allows to specify a different remote access user (e.g. when root's password is unknown).
# Default SWPM behaviour is to use root, which might not be desirable for security reasons.
# The remote access user must exist on operating system level before SWPM is executed.
sap_swpm_remote_access_user: ''


## File Permissions and Ownership Variables ###################################
# The following 9 parameters define the default permission and ownership settings as per the documentation:
# 'Installation of SAP ABAP Systems on UNIX : SAP HANA 2.0 Database - Using Software Provisioning Manager 2.0 guide'
# https://help.sap.com/docs/SLTOOLSET/39c32e9783f6439e871410848f61544c/c1f95d30d0ba4335919bf6e6f44263b2.html?version=CURRENT_VERSION_SWPM20
# The source mentions 755 as the minimum permission for the SPWM download directory
# and a umask setting of 022 for the user which downloads the SAP software.

# The permission and ownership settings for the directories in the 'sap_swpm_software_path' (String).
sap_swpm_software_directory_mode: '0755'
sap_swpm_software_directory_owner: root
sap_swpm_software_directory_group: root

# The permission and ownership settings for the SAPCAR files in the directory 'sap_swpm_sapcar_path' (String).
sap_swpm_files_sapcar_mode: '0755'
sap_swpm_files_sapcar_owner: root
sap_swpm_files_sapcar_group: root

# The permission and ownership settings for the SWPM*.SAR files in the directory 'sap_swpm_path'
# and non-SAPCAR files in the directory 'sap_swpm_software_path' (String).
sap_swpm_files_non_sapcar_mode: '0644'
sap_swpm_files_non_sapcar_owner: root
sap_swpm_files_non_sapcar_group: root


### Other Role Specific Variables #############################################
# Set to 'true' if the role should process only SWPM and SAPCAR software files (Boolean).
# Other files like SAPEXE, SAPEXEDB, igsexe, igshelper will not be validated by the role before SWPM execution.
sap_swpm_generic: false

# Set to 'true' to show output from SWPM execution (sapinst stdout) in debug task (Boolean).
sap_swpm_display_unattended_output: false

# The name of the Ansible Collection to use when calling sap_install roles (String).
sap_swpm_sap_install_collection: 'community.sap_install'

## Safety Overrides (Use With Caution)
# Override that forces execution of installation tasks if existing SAP instance is detected (Boolean).
# WARNING: This variable should be used with caution
# as running SWPM installation with active SAP instances can lead to corruption of existing SAP installation!
sap_swpm_force: false

# (Optional) Skip all detection checks. Use ONLY for testing/development on clean systems!
# WARNING: Skipping detection can lead to data loss if installation already exists!
# This will bypass all safety checks including saphostctrl, sapcontrol, and file existence checks.
# sap_swpm_skip_detection: false

# Explicit acknowledgement required for Database Load products (NW_ABAP_DB, NW_Java_DB, etc.) (Boolean).
# These products cannot be detected by this role on empty managed hosts, because no local instance files are created.
# WARNING: Running SWPM against an existing database WILL DROP and recreate the schema user, causing DATA LOSS on existing systems!
# Set to 'true' only after confirming the target database is empty or intended to be overwritten.
# The variable 'sap_swpm_force' does NOT cover this scenario and it only applies to detection of existing instances.
sap_swpm_db_load_force: false


### Other SWPM Specific Variables #############################################

# (Optional) The dictionary of environment variables to be temporarily injected when executing sapinst (Dictionary).
# This can be used to modify variables like TMP or rsdb_ssfs_connect which will be used by sapinst.
# See SAP Notes 3651688 and 2063079 for more information on TMP environment variable when executing SWPM.
sap_swpm_env_vars: {}

# (Optional) The string of extra sapinst arguments to be added to the sapinst command line (String).
sap_swpm_command_extra_args: ''

# (Optional) The path to the crlbag.p7s file when SWPM is unable to download it from the SAP URL (String).
# SWPM/sapinst downloads the file crlbag.p7s from a SAP URL during the installation.
# If the URL is not reachable, this file must be provided manually.
# See SAP note 3207613 for more information.
# sap_swpm_crlbag_path: "{{ sap_swpm_software_path }}/crlbag.p7s"

# (Optional) The dictionary containing installation templates for the role (Dictionary).
# Primarily used to define different SAP product versions and their specific role variables.
# See repository level 'playbooks' directory for more examples.
# sap_swpm_templates_install_dictionary: {}

# (Optional) The key name for the dictionary 'sap_swpm_templates_install_dictionary' (String).
# sap_swpm_templates_product_input: ''

# (Optional) The dictionary containing role variable key pairs (Dictionary).
# This allows overriding default behavior for specific scenarios, see 'Role Variable Precedence' section in README.md.
# Example:
# sap_swpm_role_parameters_dict: {}

# (Optional) The dictionary of inifile parameters to be updated after inifile is generated (List of dictionaries).
# sap_swpm_inifile_parameters_dict:
#  archives.downloadBasket: /software/download_basket
#  NW_getFQDN.FQDN: poc.cloud

# The number of parallel extraction jobs for SAP HANA database (String).
sap_swpm_parallel_jobs_nr: '23'  # Sections: db_connection_nw_hana

# (Optional) The password for the diagnostics agent (String).
sap_swpm_diagnostics_agent_password: ''

# Set to 'true' if SWPM should use a password file for existing inifile template containing encrypted passwords (Boolean).
sap_swpm_use_password_file: false

# The path where file 'instkey.pkey' is expected when sap_swpm_use_password_file is set to 'true'.
sap_swpm_password_file_path: ''

# The type of load for the SWPM installation set in inifile parameter 'loadType' (String).
# Sections: nw_config_other, syscopy_export_anydb, syscopy_import_anydb_ibmdb2
