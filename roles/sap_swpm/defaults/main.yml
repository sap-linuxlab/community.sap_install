###############################################################################
# Mandatory Role Specific Variables
###############################################################################
# NOTE: All role specific variables have to be defined directly using
# extravars, vars, inventory or directly in the playbook.

# The variable that controls whether the sapinst command will be executed (Boolean).
# Set to 'false' to skip execution of sapinst.
sap_swpm_run_sapinst: true

# The variable that controls whether the role will update the /etc/hosts file (Boolean).
# Set to 'true' to update /etc/hosts, 'false' to skip.
sap_swpm_update_etchosts: false

# The variable that controls whether the role will set the 'sidadm' and 'sapadm' user's passwords to never expire (Boolean).
# Set to 'false' to skip setting password to never expire.
sap_swpm_set_sidadm_noexpire: true

# The variable that controls whether the role will set file permissions and ownership for the SAP files in respective paths (Boolean).
# Set to 'false' to skip setting file permissions and ownership.
# See 'File Permissions and Ownership Variables' section for more information and configuration.
sap_swpm_set_file_permissions: true

# Set this variable to 'true' to configure the required firewall ports for SAP Netweaver instances (Boolean).
# See 'Firewall Configuration Variables' section for more information and configuration.
sap_swpm_configure_firewall: false

# The path to directory where existing sapinst inifile 'inifile.params' is stored (String).
# Empty or invalid path will be ignored and the role will generate new inifile.
# NOTE: It is a role specific variable, because the existing inifile is the first source of SWPM specific variables.
# It must be known before any other source is read, so it cannot be set in 'sap_swpm_role_parameters_dict'
# or 'sap_swpm_templates_install_dictionary'.
sap_swpm_inifile_directory: '/software/sap_swpm/inifiles'


###############################################################################
# Mandatory SWPM Specific Variables
###############################################################################
# NOTE: All SWPM specific variables can be defined directly using existing inifile,
# 'sap_swpm_templates_install_dictionary', extravars, vars, inventory or directly in the playbook.

# SAP Product Catalog ID describing type of SAP System to install (String).
# Value must be a valid SAP Product Catalog ID, compatible with used SWPM version.
# Example: 'NW_ABAP_OneHost:S4HANA2020.CORE.HDB.ABAP' represents S/4HANA 2020 OneHost system.
sap_swpm_product_catalog_id: ''

# The primary path to directory where role will look for all files (String).
# It has to contain all required files (e.g. igs*sar, igshelper*sar, SAPEXEDB_*SAR, SAPEXE_*SAR, IMDB_CLIENT*SAR, SAPHOSTAGENT*SAR, etc.).
sap_swpm_software_path: '/software/sapfiles'

# The path to directory with SAPCAR*EXE file (String).
# If left empty, the role will fall back to using 'sap_swpm_software_path'.
sap_swpm_sapcar_path: ''
# (Optional) The name of the SAPCAR*EXE file located in the 'sap_swpm_sapcar_path' directory (String).
# The role will automatically determine the SAPCAR*EXE file name if not specified.
# sap_swpm_sapcar_file_name: ''

# The path to directory with SWPM*.SAR file (String).
# If left empty, the role will fall back to using 'sap_swpm_software_path'.
sap_swpm_path: ''
# (Optional) The name of the SWPM*.SAR file located in the 'sap_swpm_path' directory (String).
# The role will automatically determine the SWPM*.SAR file name if not specified.
# sap_swpm_file_name: ''

# (Optional) The path to directory with extracted SWPM files (String).
# If left empty or commented out, the role will use './extracted' as a subdirectory of 'sap_swpm_path'.
# sap_swpm_software_extract_directory: ''

# The SAP System ID (SID) for the SAP system to be installed (String).
# Value must be a valid SAP System ID (SID) consisting of 3 alphanumeric characters.
# See SAP Note 1979280 for more information about accepted and restricted values.
sap_swpm_sid: ''

# Set to 'false' to disable the installation of the SAP Host Agent (Boolean).
# NOTE: It is not recommended to disable the installation of the SAP Host Agent.
sap_swpm_install_saphostagent: true  # inifile parameter: NW_System.installSAPHostAgent

# The fully qualified domain name (FQDN) of the SAP system host (String).
sap_swpm_fqdn: ''
# Set to 'false' if SWPM should not set the FQDN automatically (Boolean).
sap_swpm_set_fqdn: true  # inifile parameter: NW_getFQDN.setFQDN

